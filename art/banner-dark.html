<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#EEF3FA;
  background:
    radial-gradient(820px 460px at 50% 118%,rgba(103,184,255,.15),transparent 72%),
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0) 0 0/26px 26px,
    #0D1117;}
.page{width:100%;height:100%;padding:44px 56px 40px;display:flex;flex-direction:column}

h1{font-size:50px;font-weight:800;letter-spacing:-.035em;line-height:1}
h1 .a{color:#67B8FF}
.sub{margin-top:12px;font-size:21px;font-weight:450;color:#919AA7;letter-spacing:-.012em}
.tag{font-size:25px;font-weight:700;letter-spacing:-.022em}
.tag .a{color:#67B8FF}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:24px;min-height:0}

.win{background:#161B22;border:1px solid rgba(255,255,255,.10);border-radius:18px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.10);flex:0 0 auto}
.bar .t{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#8B94A3;text-transform:uppercase}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:6px 14px;
  font-size:12.5px;color:#8B94A3;font-weight:500}
.pad{padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.mono{font-family:'JetBrains Mono',Consolas,monospace;color:#D7DFEA}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:#8B94A3;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);padding:5px 11px;
  border-radius:999px;white-space:nowrap}
.chip.on{color:#fff;background:#67B8FF;border-color:transparent}
.ok{display:inline-flex;align-items:center;gap:7px;background:rgba(63,185,80,.16);color:#4FC463;
  font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px}
.warn{background:rgba(240,160,60,.16);color:#F0A83C}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.muted{color:#919AA7}
.accent{color:#67B8FF}
.row{display:flex;align-items:center;gap:11px}
.grow{flex:1}
.logo{filter:drop-shadow(0 14px 30px rgba(0,0,0,.30))}

.layers{display:flex;flex-direction:column;gap:12px;width:520px}
.layer{display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px 18px;
  color:#0C1422;font-weight:700;font-size:16px;box-shadow:0 18px 44px rgba(0,0,0,.55)}
.layer span{margin-left:auto;font-weight:600;font-size:13px;opacity:.72}
.dlside{display:flex;flex-direction:column;gap:12px;width:360px}
.term{background:#0B1322;border-radius:14px;padding:16px 18px;
  font-family:'JetBrains Mono',Consolas,monospace;font-size:14px;color:#CBD9EE;
  box-shadow:0 18px 44px rgba(0,0,0,.55)}
.term .p{color:#67B8FF;font-weight:700}

</style></head><body><div class="page">
<div style="display:flex;flex-direction:column;text-align:center;align-items:center;flex:0 0 auto"><h1>docker-lamp</h1><div class="sub">Linux, Apache, MySQL and PHP in one docker compose file</div></div><div class="mid" style="gap:44px"><div class="layers"><div class="layer" style="background:#F3B32B">Linux<span>base image</span></div><div class="layer" style="background:#D9453B">Apache<span>vhosts/</span></div><div class="layer" style="background:#2F8F5B">MySQL<span>persisted</span></div><div class="layer" style="background:#7B6CF6">PHP<span>www/</span></div></div><div class="dlside"><div class="term"><span class="p">$</span> cp .env-example .env<br><span class="p">$</span> docker compose up -d</div><div class="term" style="background:#0F1B2E">Apache&nbsp;&nbsp;&nbsp;running<br>MySQL&nbsp;&nbsp;&nbsp;&nbsp;running<br>PHP&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;running</div><div class="chip" style="align-self:flex-start">http://localhost</div></div></div><div class="tag" style="text-align:center;margin-top:0px;flex:0 0 auto">One file. <span class="a">A LAMP stack in a minute.</span></div>
</div></body></html>
